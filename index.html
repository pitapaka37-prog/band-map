<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="バンド名を入れると、メンバー・元メンバー・つながり・同じジャンルのバンドがわかる無料の検索アプリ">
<title>バンド相関図</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10122a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バンド相関図">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: two-ink risograph gig-flyer — misregistered display type, a spinning record as the hero, liner-note "personnel" credits, generated record sleeves for recommendations */
:root {
  --paper: #f1f2f6;
  --surface: #fbfbfd;
  --ink: #1a1e3a;
  --muted: #5f6582;
  --line: #cfd2df;
  --pink: #ff3d9a;
  --blue: #2b4fd8;
  --yellow: #f2b600;
  --vinyl: #15161c;
  --vinyl-groove: #23252e;
  --blend: multiply;
  --dot: color-mix(in srgb, var(--blue) 14%, transparent);
  --font-display: "Dela Gothic One", "Hiragino Sans", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10122a; --surface: #181b3a; --ink: #eef0ff; --muted: #9ea4c6; --line: #2c3058;
    --pink: #ff5fae; --blue: #7d98ff; --yellow: #ffd23f; --vinyl: #050609; --vinyl-groove: #14161e;
    --blend: screen; --dot: color-mix(in srgb, var(--blue) 12%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10122a; --surface: #181b3a; --ink: #eef0ff; --muted: #9ea4c6; --line: #2c3058;
  --pink: #ff5fae; --blue: #7d98ff; --yellow: #ffd23f; --vinyl: #050609; --vinyl-groove: #14161e;
  --blend: screen; --dot: color-mix(in srgb, var(--blue) 12%, transparent);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
  background-size: 7px 7px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  min-height: 100%;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
::selection { background: var(--yellow); color: #1a1e3a; }

.wrap { overflow-x: clip; max-width: 1040px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 72px; }
.view { display: flex; flex-direction: column; gap: 40px; animation: enter .45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes enter { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---- shared type ---- */
.kicker { margin: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--pink); }
.misreg { position: relative; display: inline-block; color: var(--blue); isolation: isolate; }
.misreg::before { content: attr(data-text); position: absolute; inset: 0; color: var(--pink); transform: translate(.045em, .04em); mix-blend-mode: var(--blend); z-index: 1; pointer-events: none; }
.fine { margin: 0; color: var(--muted); font-size: 12px; max-width: 62ch; line-height: 1.7; }

/* ---- top bar ---- */
.topbar { display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.logo { all: unset; cursor: pointer; font-family: var(--font-display); font-size: 20px; line-height: 1.2; color: var(--ink); display: inline-flex; align-items: center; gap: 10px; }
.logo:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
.logo .mini-rec { display: block; width: 26px; height: 26px; }
.topbar form { flex: 1 1 260px; }

/* ---- search ---- */
form.search { display: flex; align-items: stretch; background: var(--surface); border: 2px solid var(--ink); border-radius: 999px; padding: 5px; box-shadow: 5px 5px 0 var(--blue); transition: box-shadow .2s, transform .2s; }
form.search:focus-within { box-shadow: 7px 7px 0 var(--pink); transform: translate(-2px, -2px); }
form.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 18px; font-size: 18px; font-weight: 700; outline: none; }
form.search input::placeholder { color: var(--muted); font-weight: 500; }
form.search button { border: 0; border-radius: 999px; padding: 0 26px; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 15px; letter-spacing: .08em; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
form.search button:hover { background: var(--pink); color: #fff; }
form.search kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); align-self: center; margin-right: 6px; }
.topbar form.search { box-shadow: 3px 3px 0 var(--blue); padding: 3px; }
.topbar form.search input { font-size: 15px; padding: 7px 14px; }
.topbar form.search button { padding: 0 18px; font-size: 13px; }
.topbar form.search:focus-within { box-shadow: 4px 4px 0 var(--pink); }

/* ---- record ---- */
.record { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 31%, color-mix(in srgb, #fff 9%, transparent) 31.4%, transparent 32%),
    conic-gradient(from 30deg, transparent 0 8%, color-mix(in srgb, #fff 14%, transparent) 12%, transparent 18% 50%, color-mix(in srgb, #fff 10%, transparent) 58%, transparent 64%),
    repeating-radial-gradient(circle, var(--vinyl) 0 2px, var(--vinyl-groove) 2.4px 3.2px);
  box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ink) 60%, transparent);
}
.record .label { position: absolute; inset: 31%; border-radius: 50%; background: var(--pink); display: grid; place-items: center; text-align: center; overflow: hidden; }
.record .label::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, transparent 50%, var(--blue) 50%); mix-blend-mode: var(--blend); opacity: .9; }
.record .label::after { content: ""; position: absolute; width: 7%; aspect-ratio: 1; border-radius: 50%; background: var(--paper); left: 46.5%; top: 46.5%; }
.record .label span { position: relative; z-index: 1; font-family: var(--font-mono); font-weight: 700; font-size: clamp(8px, 1.6vw, 12px); letter-spacing: .14em; color: #fff; line-height: 1.5; padding: 0 12%; transform: translateY(-38%); text-transform: uppercase; overflow-wrap: anywhere; }
.spin { animation: spin 6s linear infinite; }
.spin.fast { animation-duration: 1.6s; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .view { animation: none; } }

/* ---- home ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-top: 24px; }
.hero-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hero h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(48px, 10vw, 104px); line-height: 1.02; letter-spacing: -.01em; }
.hero h1 .misreg { display: block; }
.hero .lede { margin: 0; font-size: 16px; max-width: 34em; }
.hero .lede b { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--yellow) 70%, transparent) 62%); font-weight: 700; }
.hero-art { position: relative; justify-self: center; width: min(100%, 380px); }
.hero-art .sticker { position: absolute; right: -6px; top: 4%; background: var(--yellow); color: #1a1e3a; font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: .1em; padding: 10px 12px; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; text-align: center; line-height: 1.3; transform: rotate(12deg); width: 92px; box-shadow: 3px 3px 0 var(--ink); }

.shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 32px; }
.shelf h2 { margin: 0 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 20px; display: flex; align-items: baseline; gap: 12px; }
.shelf h2 .kicker { font-size: 10px; }
.shelf .clear { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.stickers { display: flex; flex-wrap: wrap; gap: 10px; }
.stk { border: 2px solid var(--ink); background: var(--surface); padding: 6px 14px; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 3px; transform: rotate(var(--r, 0deg)); transition: transform .15s, background .15s, color .15s; box-shadow: 2px 2px 0 var(--ink); }
.stk:hover { transform: rotate(0deg) translateY(-2px); background: var(--blue); color: #fff; }
.stk.alt { border-radius: 999px; }
.stk.alt:hover { background: var(--pink); }

/* ---- loading ---- */
.loading-stage { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 40px; align-items: center; padding-top: 12px; }
.turntable { position: relative; width: 100%; max-width: 300px; }
.arm { position: absolute; right: -8%; top: -6%; width: 46%; height: 70%; transform-origin: 85% 10%; transform: rotate(18deg); animation: arm 1.2s ease-out both; pointer-events: none; }
@keyframes arm { from { transform: rotate(-4deg); } to { transform: rotate(18deg); } }
.arm line, .arm circle, .arm rect { stroke: var(--ink); }
.loading-copy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.loading-copy h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6vw, 56px); line-height: 1.1; overflow-wrap: anywhere; }
.eq { display: flex; gap: 4px; align-items: flex-end; height: 26px; }
.eq i { width: 6px; background: var(--blue); animation: eq .9s ease-in-out infinite; border-radius: 1px; }
.eq i:nth-child(2n) { background: var(--pink); animation-delay: -.3s; }
.eq i:nth-child(3n) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 60%; } .arm { animation: none; } }
.ghost-btn { align-self: flex-start; background: none; border: 2px solid var(--ink); padding: 6px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13px; }
.ghost-btn:hover { background: var(--ink); color: var(--paper); }
.loading-copy p { margin: 0; color: var(--muted); max-width: 40ch; }

/* ---- trail ---- */
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; }
.trail .lbl { color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; margin-right: 4px; }
.trail button { background: none; border: 1px dashed var(--muted); border-radius: 999px; padding: 1px 10px; cursor: pointer; color: var(--muted); font-family: var(--font-body); font-size: 13px; }
.trail button:hover { border-style: solid; border-color: var(--blue); color: var(--blue); }
.trail .arr { color: var(--pink); }
.trail .here { font-family: var(--font-body); font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); }

/* ---- result header ---- */
.flyer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 240px); gap: 36px; align-items: start; }
.flyer-copy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.flyer h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 8vw, 84px); line-height: 1.05; overflow-wrap: anywhere; text-wrap: balance; }
.stamps { display: flex; flex-wrap: wrap; gap: 10px; }
.stamp { font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 4px 10px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(var(--r, -1.5deg)); font-variant-numeric: tabular-nums; }
.stamp.k-band { color: var(--blue); } .stamp.k-artist { color: var(--pink); }
.stamp.plain { color: var(--ink); }
.flyer .note { margin: 0; font-size: 16px; max-width: 40em; line-height: 1.9; }
.flyer-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.flyer-art { position: relative; isolation: isolate; }
.flyer-art.drag .sleeve { outline: 3px dashed var(--pink); outline-offset: 6px; }
.sleeve.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.art-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.art-tools .tool { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink); text-decoration: none; line-height: 1.4; }
.art-tools .tool:hover { background: var(--ink); color: var(--paper); }
.art-tools .tool.quiet { border-color: transparent; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; }
.art-tools .tool.quiet:hover { color: var(--pink); background: none; }
.art-tools input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.art-tools label.tool:focus-within { outline: 3px solid var(--pink); outline-offset: 3px; }
.art-hint { margin: -10px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 30; box-shadow: 3px 3px 0 var(--pink); max-width: calc(100% - 32px); }
.flyer-art .sleeve { box-shadow: 8px 8px 0 var(--ink); }
.flyer-art .peek { position: absolute; width: 92%; top: 4%; right: -22%; z-index: -1; }

/* ---- liner notes ---- */
.liner { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 36px 48px; border-top: 2px solid var(--ink); padding-top: 32px; }
.credits h2 { margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.credits h2 .en { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--c); }
.credits h2 .ja { font-size: 16px; font-weight: 900; }
.credits h2 .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: auto; }
.credits ul { list-style: none; margin: 0; padding: 0; }
.credit { width: 100%; display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 9px 0; cursor: pointer; text-align: left; border-bottom: 1px solid var(--line); }
.credit .who { font-weight: 900; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; transition: color .15s; }
.credit .who small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.credit .lead { flex: 1 1 24px; min-width: 24px; border-bottom: 2px dotted var(--line); transform: translateY(-5px); align-self: flex-start; margin-top: 16px; }
.credit .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; align-self: flex-start; padding-top: 4px; }
.credit .go { font-family: var(--font-mono); color: var(--c); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; align-self: flex-start; padding-top: 2px; }
.credit:hover .who { color: var(--c); }
.credit:hover .go, .credit:focus-visible .go { opacity: 1; transform: none; }
.c-member { --c: var(--blue); } .c-former { --c: var(--muted); } .c-support { --c: var(--yellow); }
.c-produce { --c: var(--pink); } .c-influence { --c: color-mix(in srgb, var(--pink) 50%, var(--yellow)); } .c-collab { --c: color-mix(in srgb, var(--blue) 55%, var(--pink)); }

/* ---- recommendations ---- */
.recs { display: flex; flex-direction: column; gap: 20px; border-top: 2px solid var(--ink); padding-top: 32px; }
.recs-head { display: flex; flex-direction: column; gap: 6px; }
.recs-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.2; text-wrap: balance; }
.recs-head h2 em { font-style: normal; color: var(--pink); }
.crate { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 28px 22px; }
.lp { display: flex; flex-direction: column; gap: 10px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
.lp-art { position: relative; }
.lp-art .record { position: absolute; width: 88%; top: 6%; left: 6%; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.lp-art .sleeve { position: relative; z-index: 1; transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s; box-shadow: 4px 4px 0 var(--ink); }
.lp:hover .lp-art .record, .lp:focus-visible .lp-art .record { transform: translateX(30%) rotate(40deg); }
.lp:hover .lp-art .sleeve, .lp:focus-visible .lp-art .sleeve { transform: translate(-3%, -2%) rotate(-2deg); box-shadow: 6px 6px 0 var(--pink); }
@media (prefers-reduced-motion: reduce) { .lp-art .record, .lp-art .sleeve { transition: none; } }
.lp-name { font-weight: 900; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.lp-name .tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-left: 6px; text-transform: uppercase; }
.lp-why { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* ---- generated sleeve ---- */
.sleeve { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; overflow: hidden; border: 2px solid var(--ink); background-color: var(--surface); }
.sleeve .l1, .sleeve .l2 { position: absolute; inset: 0; mix-blend-mode: var(--blend); }
.sleeve .title { position: absolute; left: 8%; right: 8%; bottom: 7%; font-family: var(--font-display); font-size: clamp(14px, 2.2vw, 20px); line-height: 1.1; color: var(--ink); background: var(--surface); padding: 4px 6px; justify-self: start; width: fit-content; max-width: 84%; overflow-wrap: anywhere; z-index: 2; }
.sleeve .cat { position: absolute; top: 6%; right: 7%; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink); background: var(--surface); padding: 1px 5px; z-index: 2; letter-spacing: .08em; }

/* ---- empty / error ---- */
.notice { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 32px; align-items: center; }
.notice h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: 1.1; overflow-wrap: anywhere; }
.notice p { margin: 0; max-width: 44ch; }
.notice .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.broken { filter: grayscale(1); opacity: .5; }

.foot { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 18px; }
.src { color: var(--blue); font-weight: 700; margin-left: 8px; white-space: nowrap; }
.link-btn { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }


/* ---- browse ---- */
.still .view { animation: none; }
.browse { display: flex; flex-direction: column; gap: 18px; border-top: 2px solid var(--ink); padding-top: 28px; }
.browse-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.browse-head h2 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.2; }
.browse .count { margin: 0; font-size: 13px; color: var(--muted); }
.browse .count b { font-family: var(--font-mono); font-size: 26px; color: var(--pink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.fchip { flex: none; border: 1.5px solid var(--line); background: var(--surface); padding: 5px 13px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--ink); }
.fchip:hover { border-color: var(--ink); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 2px 2px 0 var(--pink); }
.result-line { margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.result-line .sel { font-weight: 900; font-size: 16px; }
.result-line .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.bins { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.bin { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border: 2px solid var(--ink); border-radius: 4px; background: var(--surface); text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.bin:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--blue); }

/* ---------- my registered bands ---------- */
const KEY_MINE = "band-lookup-mine-v1";
let mine = readJSON(KEY_MINE, []);
let MINEIDX = {};
const splitLine = s => { const m = String(s).match(/^(.*?)\s*[\/／|]\s*(.*)$/); return m ? [m[1].trim(), m[2].trim()] : [String(s).trim(), ""]; };
const lines = t => String(t || "").split(/\n/).map(x => x.trim()).filter(Boolean);
function mineRec(m) {
  const related = [
    ...(m.members || []).map(l => { const [n, p] = splitLine(l); return { name: n, kind: "artist", type: "member", direction: "out", years: "", note: p }; }),
    ...(m.former || []).map(l => { const [n, p] = splitLine(l); return { name: n, kind: "artist", type: "former", direction: "out", years: "", note: p }; }),
  ].filter(r => r.name);
  return { name: m.name, kind: "band", origin: m.origin || "", years: m.years || "", note: m.note || "", related,
    similar: (m.similar || []).map(l => { const [n, r] = splitLine(l); return { name: n, kind: "band", reason: r }; }).filter(x => x.name),
    region: m.region || "J", year: +m.year || 0, genres: m.genres || [], mine: true };
}
function rebuildMine() { MINEIDX = {}; mine.forEach(m => { MINEIDX[norm(m.name)] = mineRec(m); }); }
function saveMine() { writeJSON(KEY_MINE, mine); rebuildMine(); }
const allLib = () => [...Object.values(MINEIDX), ...LIB.filter(b => !MINEIDX[norm(b.name)])];
rebuildMine();

function openEditor(name = null, prefill = "") {
  if (ctl) ctl.abort();
  state = { view: "edit", editing: name, prefill, confirmDelete: false };
  render(); window.scrollTo({ top: 0 });
}

  return `${topbar()}<section class="view">
    <div class="editor-head">

      <p class="fine">地元のバンドや友達のバンドなど、収録されていないバンドを登録できます。登録した内容はこのブラウザにだけ保存され、検索や「ジャンル・年代から探す」にも出るようになります。</p>

      <div class="f-row cols">
        <label class="field"><span>メンバー（1行に1人）</span><textarea id="e-members" rows="5" placeholder="山田太郎 / ボーカル・ギター&#10;鈴木花子 / ベース">${esc((base.members || []).join("\n"))}</textarea></label>

function bindEdit() {
  const f = app.querySelector("#ed");
  app.querySelector("#e-cancel").onclick = () => {
    if (state.editing) { const r = MINEIDX[norm(state.editing)]; state = { view: "result", query: r.name, result: r }; }
    else state = { view: "home" };
    render();
  };
  f.addEventListener("submit", e => {
    e.preventDefault();
    const name = app.querySelector("#e-name").value.trim();
    const err = app.querySelector("#e-err");
    if (!name) { err.hidden = false; err.textContent = "バンド名を入れてください。"; return; }
    const clash = mine.find(x => norm(x.name) === norm(name) && norm(x.name) !== norm(state.editing || ""));
    if (clash) { err.hidden = false; err.textContent = "同じ名前のバンドがすでに登録されています。そちらを編集してください。"; return; }
    const rec = {
      name, region: app.querySelector('input[name="e-region"]:checked').value,
      year: +app.querySelector("#e-year").value || 0,
      years: app.querySelector("#e-years").value.trim(), origin: app.querySelector("#e-origin").value.trim(),
      genres: [...app.querySelectorAll(".gpick input:checked")].map(i => i.value),
      note: app.querySelector("#e-note").value.trim(),
      members: lines(app.querySelector("#e-members").value), former: lines(app.querySelector("#e-former").value),
      similar: lines(app.querySelector("#e-similar").value),
    };
    const wasEdit = !!state.editing;
    if (state.editing) mine = mine.filter(x => norm(x.name) !== norm(state.editing));
    mine.unshift(rec); saveMine();
    trail = [name];
    state = { view: "result", query: name, result: MINEIDX[norm(name)] };
    remember(name); render(); window.scrollTo({ top: 0 });
    toast(wasEdit ? "保存しました" : "登録しました");
  });
}

function deleteMine(name) {
  mine = mine.filter(x => norm(x.name) !== norm(name)); saveMine();
  recent = recent.filter(r => norm(r) !== norm(name)); writeJSON(KEY_RECENT, recent);
  trail = []; state = { view: "home" }; render(); toast(`「${name}」の登録を削除しました`);
}

let recent = readJSON(KEY_RECENT, []);
let cache = readJSON(KEY_CACHE, {});
let trail = [];            // names visited in this session, for the breadcrumb
let state = { view: "home" };
let ctl = null;


function remember(name) {
  recent = [name, ...recent.filter(r => norm(r) !== norm(name))].slice(0, 12);
  writeJSON(KEY_RECENT, recent);
}
function putCache(query, res) {
  cache[norm(query)] = res; cache[norm(res.name)] = res;
  const keys = Object.keys(cache);
  if (keys.length > 120) keys.slice(0, keys.length - 120).forEach(k => delete cache[k]);
  writeJSON(KEY_CACHE, cache);
}



function go(name) {
  name = String(name || "").trim();
  if (!name) return;
  if (ctl) ctl.abort();
  const idx = trail.findIndex(t => norm(t) === norm(name));
  trail = idx >= 0 ? trail.slice(0, idx + 1) : [...trail, name].slice(-8);
  const hit = MINEIDX[norm(name)] || cache[norm(name)] || LIBIDX[norm(name)];
  if (hit) { state = { view: "result", query: name, result: hit }; remember(hit.name); render(); return; }
  search(name);
}

const MB = "https://musicbrainz.org/ws/2/";

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function getJSON(url, signal) {
  const r = await fetch(url, { signal, headers: { Accept: "application/json" } });
  if (r.status === 503 || r.status === 429) throw { code: "busy" };
  if (!r.ok) throw { code: "http", status: r.status };
  return r.json();
}
async function mb(path, signal) {

  const wait = mbLast + 1100 - Date.now();

  mbLast = Date.now();
  return getJSON(MB + path + (path.includes("?") ? "&" : "?") + "fmt=json", signal);
}

const MUSIC_RE = /バンド|ミュージシャン|歌手|シンガー|ソングライター|ギタリスト|ベーシスト|ドラマー|キーボーディスト|作曲家|音楽家|音楽グループ|音楽ユニット|アイドルグループ|ボーカルグループ|ヴォーカルグループ|ラッパー|ヒップホップ|ロック|ポップス|DJ|プロデューサー（音楽|\bband\b|musician|singer|rapper|guitarist|bassist|drummer|keyboardist|composer|songwriter|musical (group|duo|ensemble|project)|music (group|duo|project)|(pop|rock|idol|vocal|boy|girl) (group|band)|record producer|hip[ -]hop|\bDJ\b/i;

function isMusicPage(w) {
  if (!w) return false;
  const t = w.description || (w.extract || "").slice(0, 160);
  return MUSIC_RE.test(t) && !NOT_MUSIC_RE.test(t);

async function wikiSummary(lang, title, signal) {
  try {
    const s = await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, signal);
    if (s.type === "disambiguation") return null;
    return { extract: s.extract || "", description: s.description || "", url: s.content_urls?.desktop?.page || "", image: s.thumbnail?.source || "", lang };
  } catch (e) { if (e?.name === "AbortError") throw e; return null; }
}
async function wikiFind(name, signal) {
  // search Japanese then English Wikipedia; accept only a page whose title starts with the name
  for (const [lang, hint] of [["ja", " バンド"], ["en", " band"]]) {
    try {
      const q = await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srlimit=3&format=json&origin=*&srsearch=${encodeURIComponent(name + hint)}`, signal);
      const hit = (q.query?.search || []).find(h => norm(h.title).replace(/\s*\(.*\)$/, "").startsWith(norm(name)) || norm(h.title).startsWith(norm(name)));
      if (hit) { const s = await wikiSummary(lang, hit.title, signal); if (isMusicPage(s)) return s; }
    } catch (e) { if (e?.name === "AbortError") throw e; }
  }
  return null;
}
async function wikidataInfo(qid, signal) {
  try {
    const d = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=sitelinks|claims&format=json&origin=*`, signal);
    const e = d.entities?.[qid]; if (!e) return {};
    const file = e.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
    return { ja: e.sitelinks?.jawiki?.title, en: e.sitelinks?.enwiki?.title, image: file ? commonsThumb(file) : "" };
  } catch (err) { if (err?.name === "AbortError") throw err; return {}; }
}

function relFrom(a) {
  const bandEnded = !!a["life-span"]?.ended, bandEnd = yr(a["life-span"]?.end);
  const out = new Map();
  for (const r of a.relations || []) {
    if (r["target-type"] !== "artist" || !r.artist) continue;
    const back = r.direction === "backward";
    let type = null, direction = "out", kind = r.artist.type === "Person" ? "artist" : "band";
    if (r.type === "member of band") {
      const relEnd = yr(r.end);
      const left = a.type === "Person" ? !!r.ended : r.ended && !(bandEnded && (!relEnd || !bandEnd || relEnd >= bandEnd));
      type = left ? "former" : "member";
      if (!back) kind = "band";
    } else if (/supporting musician/.test(r.type)) { type = "support"; direction = back ? "in" : "out"; }
    else if (r.type === "collaboration") type = "collab";
    else if (r.type === "subgroup") type = "collab";
    else continue;
    const parts = [...new Set((r.attributes || []).map(x => INSTR[x]).filter(Boolean))];
    const note = [r.type === "subgroup" ? "派生グループ" : "", parts.join("・")].filter(Boolean).join(" / ");
    const key = norm(r.artist.name) + "|" + type;
    const prev = out.get(key);
    const years = span(r.begin, r.end, r.ended);
    if (prev) { if (years && !prev.years.includes(years)) prev.years = [prev.years, years].filter(Boolean).join(", "); if (!prev.note && note) prev.note = note; }
    else out.set(key, { name: r.artist.name, kind, type, direction, years, note });
  }
  // someone listed both as member and former: keep member
  const list = [...out.values()];
  return list.filter(x => !(x.type === "former" && list.some(y => y.type === "member" && norm(y.name) === norm(x.name))));
}

async function onlineSearch(query, signal, onStep) {
  onStep?.("MusicBrainzで探しています");
  const q = luceneEsc(query);
  const s = await mb(`artist/?limit=8&query=${encodeURIComponent(`artist:"${q}" OR alias:"${q}" OR sortname:"${q}"`)}`, signal);
  const cands = (s.artists || []).filter(a => a.score >= 90);
  const exact = cands.filter(a => norm(a.name) === norm(query) || (a.aliases || []).some(al => norm(al.name) === norm(query)));
  const pool = exact.length ? exact : cands;
  const pick = pool.find(a => a.type === "Group") || pool[0];

  if (!pick) {
    onStep?.("Wikipediaで探しています");
    const w = await wikiFind(query, signal);
    if (!w) return null;
    return { name: query, kind: "band", origin: "", years: "", note: w.extract, related: [], similar: [], online: true, image: w.image, links: { wiki: w.url } };
  }

  onStep?.("メンバーとつながりを取得しています");
  const a = await mb(`artist/${pick.id}?inc=artist-rels+url-rels+tags+genres+aliases`, signal);
  const related = relFrom(a);
  const tags = [...(a.genres || []), ...(a.tags || [])].sort((x, y) => (y.count || 0) - (x.count || 0)).map(t => t.name)
    .filter((t, i, arr) => arr.indexOf(t) === i).slice(0, 6);
  const genres = [...new Set(tags.map(t => TAG2G[t]).filter(Boolean))];

  onStep?.("Wikipediaの紹介文と写真を取得しています");
  const wd = (a.relations || []).find(r => r.type === "wikidata")?.url?.resource?.match(/Q\d+$/)?.[0];
  let wiki = null, image = "";
  if (wd) {
    const info = await wikidataInfo(wd, signal);
    image = info.image || "";
    if (info.ja) wiki = await wikiSummary("ja", info.ja, signal);
    if (!wiki && info.en) wiki = await wikiSummary("en", info.en, signal);
  }
  if (!wiki) wiki = await wikiFind(a.name, signal);
  if (!image && wiki?.image) image = wiki.image;

  // recommendations: the library's picks when we have them, otherwise groups sharing the top tag
  let similar = LIBIDX[norm(a.name)]?.similar || [];
  if (!similar.length && tags.length) {
    onStep?.("同じジャンルのバンドを探しています");
    try {
      const tq = `tag:"${luceneEsc(tags[0])}" AND type:group` + (a.country ? ` AND country:${a.country}` : "");
      const t = await mb(`artist/?limit=15&query=${encodeURIComponent(tq)}`, signal);
      similar = (t.artists || []).filter(x => x.id !== a.id && !related.some(r => norm(r.name) === norm(x.name)))
        .slice(0, 8).map(x => ({ name: x.name, kind: "band", reason: [`「${tags[0]}」`, yr(x["life-span"]?.begin) && `${yr(x["life-span"].begin)}年〜`, area(x.area?.name)].filter(Boolean).join(" · ") }));
    } catch (e) { if (e?.name === "AbortError") throw e; }
  }

  const ls = a["life-span"] || {};
  return {
    name: a.name, kind: a.type === "Person" ? "artist" : "band",
    origin: [area(a["begin-area"]?.name), area(a.area?.name)].filter((x, i, arr) => x && arr.indexOf(x) === i).join("・"),
    years: span(ls.begin, ls.end, ls.ended) || "",
    note: wiki?.extract ? (wiki.extract.length > 260 ? wiki.extract.slice(0, 258) + "…" : wiki.extract) : (a.disambiguation || ""),
    related, similar, genres, tags, online: true, image,
    sameTag: !LIBIDX[norm(a.name)]?.similar?.length,
    links: { mb: `https://musicbrainz.org/artist/${a.id}`, wiki: wiki?.url || "" },
  };
}

const NET_ERR = "情報を取得できませんでした。インターネットにつながっているか確認してください。claude.aiの中で開いている場合は、外部サイトにアクセスできないため使えません。";

async function search(query, refresh = false) {
  if (navigator.onLine === false) {
    state = { view: "error", query, retry: true, message: "オフラインのため、収録されていないバンドは調べられません。収録バンドと自分で登録したバンドはオフラインでも見られます。" };
    render(); return;
  }
  const my = new AbortController(); ctl = my;
  state = { view: "loading", query, step: "準備しています" }; render();
  const onStep = t => { if (ctl === my && state.view === "loading") { state.step = t; const el = document.getElementById("step"); if (el) el.textContent = t; } };
  try {
    let res = await onlineSearch(query, my.signal, onStep);
    if (ctl !== my) return;
    if (!res) { state = { view: "unknown", query }; render(); return; }
    const lib = LIBIDX[norm(res.name)] || LIBIDX[norm(query)];
    if (lib) { // keep the library's picks and genres when the online record lacks them
      if (!res.similar.length) { res.similar = lib.similar; res.sameTag = false; }
      if (!res.related.length) res.related = lib.related;
      res.builtinBase = true;
    }
    putCache(query, res); remember(res.name);
    if (res.image) setRemoteImg(res.name, res.image);
    if (trail.length) trail[trail.length - 1] = res.name;
    state = { view: "result", query, result: res }; render();
  } catch (e) {
    if (ctl !== my) return;
    if (e?.name === "AbortError") { state = { view: "home" }; render(); return; }
    state = { view: "error", query, retry: true,
      message: e?.code === "busy" ? "MusicBrainzが混み合っています。少し待ってからもう一度試してください。" : NET_ERR };
    render();
  }
}

async function enrichLibrary(r) {

  const k = norm(r.name);
  if (triedWiki.has(k) || r.links?.wiki) return;
  triedWiki.add(k);

    r.links = { ...(r.links || {}), wiki: w.url };

    if (state.view === "result" && norm(state.result?.name) === k) render();
  } catch (e) {}
}

/* ---------- visual helpers ---------- */
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const tilt = s => ((hash(s) % 7) - 3) * 0.8;

function sleeve(name, withTitle = true) {
  const h = hash(name), p = h % 6, a = (h >> 3) % 180, x = 20 + (h >> 7) % 60, y = 15 + (h >> 11) % 55, r = 22 + (h >> 13) % 22;
  const P = "var(--pink)", B = "var(--blue)";
  const L = [
    [`radial-gradient(circle at ${x}% ${y}%, ${P} 0 ${r}%, transparent ${r + .5}%)`, `repeating-linear-gradient(${a}deg, ${B} 0 6px, transparent 6px 14px)`],
    [`repeating-radial-gradient(circle at ${x}% ${y}%, ${P} 0 8px, transparent 8px 18px)`, `linear-gradient(${a}deg, ${B} 0 45%, transparent 45%)`],
    [`radial-gradient(${P} 32%, transparent 35%) 0 0 / 12px 12px`, `radial-gradient(circle at ${x}% ${y}%, ${B} 0 ${r + 12}%, transparent ${r + 12.5}%)`],
    [`conic-gradient(from ${a}deg at ${x}% ${y}%, ${P} 0 25%, transparent 0 50%, ${P} 0 75%, transparent 0)`, `repeating-radial-gradient(circle at 50% 115%, ${B} 0 3px, transparent 3px 11px)`],
    [`linear-gradient(${a}deg, transparent 0 28%, ${P} 28% 58%, transparent 58%)`, `linear-gradient(${a + 90}deg, transparent 0 38%, ${B} 38% 72%, transparent 72%)`],
    [`repeating-conic-gradient(from ${a}deg at ${x}% ${y}%, ${P} 0 9deg, transparent 9deg 20deg)`, `radial-gradient(circle at ${100 - x}% ${100 - y}%, ${B} 0 ${r}%, transparent ${r + .5}%)`],
  ][p];
  return `<div class="sleeve" aria-hidden="true"><div class="l1" style="background:${L[0]}"></div><div class="l2" style="background:${L[1]}"></div>
    <span class="cat">BFT-${String(h % 900 + 100)}</span>${withTitle ? `<span class="title">${esc(name)}</span>` : ""}</div>`;
}

  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;

function setImage(name, file) {
  if (!file || !/^image\//.test(file.type)) { toast("画像ファイルを選んでください"); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const S = 560, side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement("canvas"); c.width = c.height = Math.min(S, side);
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const data = c.toDataURL("image/jpeg", 0.82);
    images[norm(name)] = data;
    try { localStorage.setItem(KEY_IMG, JSON.stringify(images)); toast("画像を設定しました"); }
    catch (e) { toast("画像を表示しました（保存容量がいっぱいのため、次回は消えます）"); }
    render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("この画像は読み込めませんでした"); };
  img.src = url;
}

const ERAS = { 1960: "60年代", 1970: "70年代", 1980: "80年代", 1990: "90年代", 2000: "00年代", 2010: "10年代〜" };
const eraOf = y => (y >= 2010 ? 2010 : Math.floor(y / 10) * 10);
let browse = (() => { try { return { region: "all", era: "all", genre: "all", ...JSON.parse(localStorage.getItem("band-lookup-browse-v1") || "{}"), limit: 18 }; } catch (e) { return { region: "all", era: "all", genre: "all", limit: 18 }; } })();

function saveBrowse() { try { localStorage.setItem("band-lookup-browse-v1", JSON.stringify({ region: browse.region, era: browse.era, genre: browse.genre })); } catch (e) {} }
function filtered() {
  return allLib().filter(b => (browse.region === "all" || b.region === browse.region)
    && (browse.era === "all" || eraOf(b.year) === +browse.era)
    && (browse.genre === "all" || b.genres.includes(browse.genre)))
    .sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0) || a.year - b.year);

const browseKey = () => `${browse.region}|${browse.era}|${browse.genre}`;
function browseLabel() {
  const parts = [];
  if (browse.region !== "all") parts.push(browse.region === "J" ? "日本" : "海外");
  if (browse.era !== "all") parts.push(ERAS[browse.era]);
  if (browse.genre !== "all") parts.push(GENRES[browse.genre]);
  return parts.join(" × ") || "すべて";
}
function chipRow(group, opts) {
  return `<div class="filter-row" role="group" aria-label="${group === "region" ? "地域" : group === "era" ? "年代" : "ジャンル"}">
    ${opts.map(([v, l]) => `<button type="button" class="fchip" data-f="${group}" data-v="${v}" aria-pressed="${String(browse[group]) === String(v)}">${l}</button>`).join("")}
  </div>`;
}
function browseHtml() {
  const list = filtered();
  const shown = list.slice(0, browse.limit);
  const ai = aiList[browseKey()];
  const canAsk = browseKey() !== "all|all|all";
  return `<section class="browse" id="browse">
    <div class="browse-head">
      <div><p class="kicker">Crate Digging</p><h2>ジャンル・年代から探す</h2></div>
      <div class="head-side"><p class="count"><b>${allLib().length}</b>組を収録${mine.length ? `（うちマイ登録${mine.length}）` : ""}</p><button type="button" class="add-mine" id="addMine">＋ 自分でバンドを登録</button></div>
    </div>
    <div class="filters">
      ${chipRow("region", [["all", "すべての地域"], ["J", "日本"], ["W", "海外"]])}
      ${chipRow("era", [["all", "すべての年代"], ...Object.entries(ERAS)])}
      ${chipRow("genre", [["all", "すべてのジャンル"], ...Object.entries(GENRES)])}
    </div>
    <p class="result-line"><span class="sel">${esc(browseLabel())}</span><span class="n">${list.length}組</span>
      ${browseKey() !== "all|all|all" ? `<button type="button" class="link-btn" id="fReset">条件をリセット</button>` : ""}</p>
    ${shown.length ? `<div class="bins">${shown.map(b => `<button type="button" class="bin" data-go="${esc(b.name)}">
        <span class="bin-art">${artFor(b.name, false)}</span>
        <span class="bin-txt"><span class="bin-name">${esc(b.name)}${b.mine ? `<span class="my-badge">MY</span>` : ""}</span>
        <span class="bin-meta">${esc([b.years, (b.origin || "").split("・")[0]].filter(Boolean).join(" · ") || "—")}</span>
        <span class="bin-tags">${b.genres.filter(g => g !== "indie").slice(0, 2).map(g => GENRES[g]).join(" / ") || (b.genres.includes("indie") ? "インディーズ" : "")}</span></span>
      </button>`).join("")}</div>` : `<p class="fine">この条件に合う収録バンドはありません。下のボタンでMusicBrainzから探せます。</p>`}
    ${list.length > shown.length ? `<button type="button" class="ghost-btn more" id="fMore">さらに表示（残り${list.length - shown.length}組）</button>` : ""}
    ${canAsk ? `<div class="ai-box">
      ${!ai ? `<button type="button" class="ai-btn" id="aiAsk"><span class="ai-dot"></span>「${esc(browseLabel())}」のバンドをMusicBrainzでもっと探す</button>
        <p class="fine">世界中の音楽データベースMusicBrainzから、条件に合う収録外のバンドを探します。</p>`
      : ai.status === "loading" ? `<div class="ai-loading"><div class="eq" aria-hidden="true">${"<i></i>".repeat(8)}</div><span>「${esc(browseLabel())}」のバンドを探しています…</span><button type="button" class="link-btn" id="aiStop">中止</button></div>`
      : ai.status === "error" ? `<p class="fine">${esc(ai.message)}</p><button type="button" class="ghost-btn" id="aiAsk">もう一度試す</button>`
      : `<h3 class="ai-title"><span class="kicker">From MusicBrainz</span>MusicBrainzで見つかった「${esc(browseLabel())}」のバンド</h3>
        <ul class="ai-list">${ai.items.map(x => `<li><button type="button" data-go="${esc(x.name)}">
          <span class="ai-name">${esc(x.name)}${x.years || x.origin ? `<small>${esc([x.years, x.origin].filter(Boolean).join(" · "))}</small>` : ""}</span>
          <span class="ai-note">${esc(x.note)}</span><span class="go" aria-hidden="true">→</span></button></li>`).join("")}</ul>
        <button type="button" class="link-btn" id="aiAgain">続きを探す</button>`}
    </div>` : ""}
  </section>`;
}

async function askMore(again = false) {
  const key = browseKey();
  if (aiCtl) aiCtl.abort();
  const my = new AbortController(); aiCtl = my;
  const prev = aiList[key];
  const offset = again && prev?.offset != null ? prev.offset + 25 : 0;
  const exclude = new Set([...filtered().map(b => norm(b.name)), ...(again && prev?.items ? prev.items.map(x => norm(x.name)) : [])]);
  aiList[key] = { status: "loading" }; render(); document.getElementById("browse")?.scrollIntoView({ block: "nearest" });
  const parts = ["type:group"];
  if (browse.genre !== "all") parts.push(`tag:"${luceneEsc(G2TAG[browse.genre])}"`);
  if (browse.region === "J") parts.push("country:JP");
  if (browse.region === "W") parts.push("NOT country:JP");
  if (browse.era !== "all") { const y = +browse.era; parts.push(`begin:[${y} TO ${y >= 2010 ? 2099 : y + 9}\\-12\\-31]`); }
  try {
    const res = await mb(`artist/?limit=25&offset=${offset}&query=${encodeURIComponent(parts.join(" AND "))}`, my.signal);
    if (aiCtl !== my) return;
    const items = (res.artists || []).filter(x => x.name && !exclude.has(norm(x.name))).map(x => ({
      name: x.name, years: span(x["life-span"]?.begin, x["life-span"]?.end, x["life-span"]?.ended),
      origin: area(x.area?.name), note: x.disambiguation || (x.tags || []).sort((p, q) => q.count - p.count).slice(0, 3).map(t => t.name).join(" / "),
    }));
    aiList[key] = items.length ? { status: "done", items, offset } : { status: "error", message: "この条件ではこれ以上見つかりませんでした。条件を変えて試してください。" };
  } catch (e) {
    if (aiCtl !== my) return;
    aiList[key] = e?.name === "AbortError" ? undefined : { status: "error", message: e?.code === "busy" ? "MusicBrainzが混み合っています。少し待ってからもう一度試してください。" : NET_ERR };
  }
  aiCtl = null;
  if (state.view === "home") { render(); document.getElementById("browse")?.scrollIntoView({ block: "nearest" }); }
}

/* ---------- install as an app ---------- */
let installEvt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const installDismissed = () => { try { return localStorage.getItem("band-free-install-dismissed") === "1"; } catch (e) { return false; } };
function installHtml() {
  if (isStandalone() || installDismissed()) return "";
  if (installEvt) return `<div class="install"><span class="install-ico" aria-hidden="true"></span>
    <p><b>アプリとして使う</b>ホーム画面に追加すると、アイコンからすぐ開けます。</p>
    <button type="button" class="install-btn" id="instGo">ホーム画面に追加</button><button type="button" class="install-x" id="instX" aria-label="閉じる">×</button></div>`;
  if (isIOS()) return `<div class="install"><span class="install-ico" aria-hidden="true"></span>
    <p><b>アプリとして使う</b>Safariの共有ボタン<span class="share-ico" aria-hidden="true">⬆︎</span>から「ホーム画面に追加」を選ぶと、アイコンからすぐ開けます。</p>
    <button type="button" class="install-x" id="instX" aria-label="閉じる">×</button></div>`;
  return "";
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (state.view === "home") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; if (state.view === "home") render(); toast("ホーム画面に追加しました"); });
function bindInstall() {
  app.querySelector("#instGo")?.addEventListener("click", async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (e) {}
    installEvt = null; render();
  });
  app.querySelector("#instX")?.addEventListener("click", () => { try { localStorage.setItem("band-free-install-dismissed", "1"); } catch (e) {} render(); });
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
window.addEventListener("online", () => { if (state.view === "home") render(); });
window.addEventListener("offline", () => { if (state.view === "home") render(); toast("オフラインになりました。収録バンドは引き続き見られます"); });

function bindBrowse() {
  app.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    browse[b.dataset.f] = b.dataset.v; browse.limit = 18; saveBrowse();
    const y = window.scrollY; render(); window.scrollTo({ top: y });
  });
  app.querySelector("#fReset")?.addEventListener("click", () => { browse.region = browse.era = browse.genre = "all"; browse.limit = 18; saveBrowse(); const y = window.scrollY; render(); window.scrollTo({ top: y }); });
  app.querySelector("#fMore")?.addEventListener("click", () => { browse.limit += 36; const y = window.scrollY; render(); window.scrollTo({ top: y }); });
  app.querySelector("#addMine")?.addEventListener("click", () => openEditor());
  app.querySelector("#aiAsk")?.addEventListener("click", () => askMore(false));
  app.querySelector("#aiAgain")?.addEventListener("click", () => askMore(true));
  app.querySelector("#aiStop")?.addEventListener("click", () => aiCtl?.abort());
}

/* ---------- views ---------- */
function viewHome() {
  return `<section class="view">
    <div class="hero">
      <div class="hero-copy">
        <p class="kicker">Band Family Tree — Liner Notes Search</p>
        <h1><span class="misreg" data-text="バンド">バンド</span><span class="misreg" data-text="相関図">相関図</span></h1>
        <p class="lede">名前を入れると、<b>メンバー・元メンバー・プロデューサー・影響関係</b>と、<b>似ているおすすめのアーティスト</b>がわかります。定番の${LIB.length}組はすぐ表示、それ以外もWikipediaと音楽データベースからその場で探します。出てきた名前をタップして、つながりをどこまでもたどれます。</p>
        ${searchForm()}
        ${installHtml()}
        ${navigator.onLine === false ? `<p class="offline-note">オフラインです。収録バンドと自分で登録したバンドは見られます。</p>` : ""}
      </div>
      <div class="hero-art">${record("Side A · Family Tree", "spin")}<span class="sticker">DIG<br>DEEPER</span></div>
    </div>
    <div class="shelf">
      ${recent.length ? `<section><h2>最近調べた<span class="kicker">Recently Played</span><button class="clear" type="button" id="clr">履歴を消す</button></h2>
        <div class="stickers">${recent.map(r => `<button class="stk" type="button" style="--r:${tilt(r)}deg" data-go="${esc(r)}">${esc(r)}</button>`).join("")}</div></section>` : ""}
      <section><h2>例えば<span class="kicker">Try These</span></h2>
        <div class="stickers">${EXAMPLES.map(r => `<button class="stk alt" type="button" style="--r:${tilt(r)}deg" data-go="${esc(r)}">${esc(r)}</button>`).join("")}</div></section>
    </div>
    ${browseHtml()}
    <p class="fine">定番バンドは収録データからすぐ表示します。それ以外は、無料の音楽データベースMusicBrainzとWikipediaからその場で取得します。登録やAPIキーは不要です。</p>
  </section>`;
}

function viewLoading() {
  return `${topbar()}<section class="view">
    ${trailHtml()}
    <div class="loading-stage">
      <div class="turntable">${record(state.query, "spin fast")}${ARM}</div>
      <div class="loading-copy">
        <p class="kicker">Now Digging</p>
        <h2><span class="misreg" data-text="${esc(state.query)}">${esc(state.query)}</span></h2>
        <div class="eq" aria-hidden="true">${"<i></i>".repeat(12)}</div>
        <p>収録されていないので、MusicBrainzとWikipediaからその場で探しています。数秒〜10秒ほどかかります。</p>
        <p class="kicker" id="step">${esc(state.step || "")}</p>
        <button class="ghost-btn" type="button" id="stop">中止</button>
      </div>
    </div>
  </section>`;
}

function viewNotice() {
  const unknown = state.view === "unknown";
  return `${topbar()}<section class="view">
    ${trailHtml()}
    <div class="notice">
      ${record("No Data", "broken")}
      <div class="stack">
        <p class="kicker">${unknown ? "Not Found" : "Skipped"}</p>
        <h1>${esc(state.query)}</h1>
        <p>${unknown ? "音楽のバンド・アーティストとしては見つかりませんでした。このアプリはバンドやアーティストの名前だけを検索できます。正式な表記や英語表記で試してみてください。" : esc(state.message)}</p>
        <div class="mine-tools">
        ${state.retry ? `<button class="ghost-btn" type="button" id="retry">もう一度調べる</button>` : ""}
        <button class="add-mine" type="button" id="addMineN">＋ 「${esc(state.query)}」を自分で登録する</button></div>
      </div>
    </div>
  </section>`;
}

function viewResult() {
  const r = state.result;
  const groups = {};
  r.related.forEach(x => {
    const [en, ja] = HEADS[x.type](r.kind, x.direction);
    (groups[x.type + "|" + en] ||= { type: x.type, en, ja, items: [] }).items.push(x);
  });
  const sorted = Object.values(groups).sort((a, b) => REL_KEYS.indexOf(a.type) - REL_KEYS.indexOf(b.type));
  const stamps = [
    `<span class="stamp k-${r.kind}" style="--r:-2deg">${r.kind === "band" ? "BAND / バンド" : "ARTIST / アーティスト"}</span>`,
    r.years ? `<span class="stamp plain" style="--r:1.5deg">${esc(r.years)}</span>` : "",
    r.origin ? `<span class="stamp plain" style="--r:-1deg">${esc(r.origin)}</span>` : "",
    ...(r.tags || []).slice(0, 3).map((t, i) => `<span class="stamp plain" style="--r:${i % 2 ? 1 : -1}deg">#${esc(t)}</span>`),
    r.builtin ? `<span class="stamp lib" style="--r:2deg">収録データ</span>` : "",
    r.mine ? `<span class="stamp mine" style="--r:2deg">マイ登録</span>` : "",
    r.online ? `<span class="stamp lib" style="--r:2deg">ネットから取得</span>` : "",
  ].join("");
  return `${topbar()}<section class="view">
    ${trailHtml()}
    <div class="flyer">
      <div class="flyer-copy">
        <p class="kicker">${r.kind === "band" ? "Band Profile" : "Artist Profile"}</p>
        <h1><span class="misreg" data-text="${esc(r.name)}">${esc(r.name)}</span></h1>
        <div class="stamps">${stamps}</div>
        ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
      </div>
      <div class="flyer-side">
        <div class="flyer-art" id="art">${record(r.name, "peek spin")}${artFor(r.name, false)}</div>
        <div class="art-tools">
          <a class="tool" href="https://www.google.com/search?tbm=isch&amp;q=${encodeURIComponent(r.name + (r.kind === "band" ? " バンド" : ""))}" target="_blank" rel="noopener">画像を検索 ↗</a>
          <label class="tool">${imgOf(r.name) ? "画像を変える" : "画像を設定"}<input type="file" id="imgFile" accept="image/*"></label>
          ${imgOf(r.name) ? `<button class="tool quiet" type="button" id="imgClear">外す</button>` : ""}
        </div>
        <p class="art-hint">Wikipediaに写真があれば自動で表示します。好きな画像にしたいときは「画像を設定」で選ぶか、ここにドラッグ＆ドロップ（コピーした画像の貼り付けも可）すると、このブラウザに保存されて次からも表示されます。</p>
      </div>
    </div>

    ${sorted.length ? `<div class="liner">${sorted.map(g => `
      <section class="credits c-${g.type}">
        <h2><span class="en">${g.en}</span><span class="ja">${g.ja}</span><span class="n">${String(g.items.length).padStart(2, "0")}</span></h2>
        <ul>${g.items.map(x => `<li><button type="button" class="credit" data-go="${esc(x.name)}">
          <span class="who">${esc(x.name)}${x.note ? `<small>${esc(x.note)}</small>` : ""}</span>
          <span class="lead"></span>
          ${x.years ? `<span class="when">${esc(x.years)}</span>` : ""}
          <span class="go" aria-hidden="true">→</span></button></li>`).join("")}</ul>
      </section>`).join("")}</div>` : `<p class="fine">関係する人物やバンドは見つかりませんでした。</p>`}

    ${r.similar?.length ? `<section class="recs">
      <div class="recs-head"><p class="kicker">If You Like This, Dig These</p>
        <h2>${r.sameTag ? `<em>${esc(r.name)}</em> と同じジャンルのバンド` : `<em>${esc(r.name)}</em> が好きなら`}</h2></div>
      <div class="crate">${r.similar.map(x => `<button type="button" class="lp" data-go="${esc(x.name)}">
        <div class="lp-art">${record(x.name)}${artFor(x.name)}</div>
        <span class="lp-name">${esc(x.name)}<span class="tag">${x.kind === "band" ? "Band" : "Artist"}</span></span>
        ${x.reason ? `<span class="lp-why">${esc(x.reason)}</span>` : ""}
      </button>`).join("")}</div>
    </section>` : ""}

    <div class="foot">
      <p class="fine">${r.online ? "情報はMusicBrainz（CC0）とWikipedia（CC BY-SA）から取得しています。" : r.mine ? "あなたが登録した情報です。" : "収録データです。最近のメンバーチェンジなどは反映されていないことがあります。"}
        ${r.links?.mb ? `<a class="src" href="${esc(r.links.mb)}" target="_blank" rel="noopener">MusicBrainz ↗</a>` : ""}
        ${r.links?.wiki ? `<a class="src" href="${esc(r.links.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>` : ""}</p>
      ${r.mine ? `<div class="mine-tools">
        ${state.confirmDelete ? `<span class="fine">この登録を削除しますか？</span><button class="danger-btn solid" type="button" id="delYes">削除する</button><button class="ghost-btn" type="button" id="delNo">やめる</button>`
        : `<button class="ghost-btn" type="button" id="editMine">登録を編集</button><button class="danger-btn" type="button" id="delMine">削除</button>`}</div>`
      : `<button class="link-btn" type="button" id="refresh">${r.builtin ? "ネットの最新情報で調べ直す" : "最新情報に更新"}</button>`}
    </div>
  </section>`;
}

let lastView = null;
function render() {
  const v = state.view;
  app.classList.toggle("still", v === lastView && v === "home");
  const firstHome = v === "home" && lastView !== "home";
  lastView = v;
  app.innerHTML = v === "home" ? viewHome() : v === "loading" ? viewLoading() : v === "result" ? viewResult() : v === "edit" ? viewEdit() : viewNotice();
  if (v === "edit") bindEdit();
  app.querySelector("#addMineN")?.addEventListener("click", () => openEditor(null, state.query));
  app.querySelector("#editMine")?.addEventListener("click", () => openEditor(state.result.name));
  app.querySelector("#delMine")?.addEventListener("click", () => { state.confirmDelete = true; render(); });
  app.querySelector("#delNo")?.addEventListener("click", () => { state.confirmDelete = false; render(); });
  app.querySelector("#delYes")?.addEventListener("click", () => deleteMine(state.result.name));

  app.querySelector("#sf").addEventListener("submit", e => { e.preventDefault(); go(app.querySelector("#q").value); window.scrollTo({ top: 0 }); });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { go(b.dataset.go); window.scrollTo({ top: 0 }); });
  app.querySelector("#home")?.addEventListener("click", () => { if (ctl) ctl.abort(); ctl = null; trail = []; state = { view: "home" }; render(); });
  app.querySelector("#stop")?.addEventListener("click", () => ctl?.abort());
  app.querySelector("#retry")?.addEventListener("click", () => search(state.query));
  app.querySelector("#refresh")?.addEventListener("click", () => {
    const q = state.result.name; delete cache[norm(q)]; delete cache[norm(state.query)]; writeJSON(KEY_CACHE, cache);
    search(q, true);
  });
  app.querySelector("#clr")?.addEventListener("click", () => { recent = []; writeJSON(KEY_RECENT, recent); render(); });
  if (v === "home") { bindBrowse(); bindInstall(); }
  if (firstHome && matchMedia("(pointer: fine)").matches) app.querySelector("#q").focus({ preventScroll: true });
  if (v === "result" && state.result.builtin && !state.result.online) enrichLibrary(state.result);
  if (v === "result") {
    const name = state.result.name;
    app.querySelector("#imgFile").addEventListener("change", e => setImage(name, e.target.files[0]));
    app.querySelector("#imgClear")?.addEventListener("click", () => {
      delete images[norm(name)]; try { localStorage.setItem(KEY_IMG, JSON.stringify(images)); } catch (e) {}
      render(); toast("画像を外しました");
    });
    const art = app.querySelector("#art");
    art.addEventListener("dragover", e => { e.preventDefault(); art.classList.add("drag"); });
    art.addEventListener("dragleave", () => art.classList.remove("drag"));
    art.addEventListener("drop", e => { e.preventDefault(); art.classList.remove("drag"); setImage(name, e.dataTransfer.files[0]); });
  }
}

document.addEventListener("paste", e => {
  if (state.view !== "result") return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f) { e.preventDefault(); setImage(state.result.name, f); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) { e.preventDefault(); app.querySelector("#q")?.focus(); }
});

render();
</script>
